# main_pcd.py launch configuration for:
#   pointcloude/scans-260514.pcd
#
# Run from repo root:
#   python3 main_pcd.py --yml yml/pcd/scans_260514.yml
# or:
#   ./run_from_yml.sh --yml yml/pcd/scans_260514.yml

pcd: pointcloude/scans-260514.pcd
up_axis: z
seed: 0

# Environment / preprocessing
voxel: 0.10
r_safe: 0.5
ground_thresh: 0.15
ground_clearance: 0.08
max_surface_z: 100.0
max_slope_deg: 50.0
surface_lift: null
walkable_edge_margin: 0
obstacle_radius_filter_radius: 0.33
obstacle_radius_filter_min_neighbors: 4
scale: 10
z_origin: min

# Ceiling crop (applied inside build_environment; same cloud for planner + viewer)
vis_strip_ceiling: true
vis_ceiling_gap: 0.12
# vis_z_max: null
# vis_ceiling_quantile: null

# Walkable surface detection
walkable_normal_radii: null
z_min_walkable_surface: 0.04

# Elevation-map walkable-surface filtering
elev_max_roughness: 0.5
elev_max_slope: 0.85
elev_min_area: 0.2

# Local plane regression confirmation for real-scan walkable surfaces.
# Only locally planar candidates are carved from the obstacle cloud, and their
# landing/clearance points are projected onto the fitted local plane.
surface_regression: true
surface_regression_radius: 0.5
surface_regression_min_neighbors: 12
surface_regression_max_rmse: 0.08
surface_regression_max_projection: 0.15

# PRM
num_ground: 800
num_surface: 800
num_aerial: 800
unified_walk: true

# Planner
rmax: 5
wg: 5
wf: 1
e_factor: 0.1

# Path smoothing
smoothing: 3.0
spline_degree: 3
lift_epsilon: 1.0

# Coordinates are in the scaled/aligned planning frame. With z_origin: min,
# the lowest point in the displayed/planned cloud is z=0.
# Tune these after the first visualization if they land outside free space.
start: [-15, -20, -100]
end: [-5, 6, -100]

# Visualization
no_vis: false
show_prm: false
no_samples: false
bg: dark
dim_raw: 1.0
keep_rgb: false
point_size: 2.0

# This file has no RGB field, so height coloring is the most useful default.
vis_color: height
vis_brightness: 1.3

# The source cloud is large (~6.75M points); this display-only voxel keeps the
# viewer responsive without changing the planner/collision cloud above.
vis_cloud_voxel: 0.10
vis_cloud_denoise: false
vis_show_normals: false
vis_estimate_normals: false
vis_lighting: false
vis_recenter: false
vis_zoom: 0.7
vis_show_bbox: false

vis_inflated_obstacles: true
vis_inflated_mode: voxel
vis_inflated_voxel: 0.15
vis_inflated_max_centers: 6000
vis_inflated_sphere_samples: 64
vis_inflated_shells: 1

# path_radius: null
# marker_radius: null
