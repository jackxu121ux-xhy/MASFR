# main_pcd parameters (keys = argparse destinations, underscores)
# Mirrors:
#   python main_pcd.py --pcd datasets/livingroom.ply --up-axis y \
#     --voxel 0.05 --r-safe 0.15 --rmax 5 \
#     --ground-clearance 0.08 --max-surface-z 100.0 \
#     --num-ground 1500 --num-surface 1500 --num-aerial 1500 \
#     --start -10 -25 5 --end 2 3 5 \
#     --wg 1 --wf 5 --e-factor 0.1 --scale 10 \
#     --vis-strip-ceiling --vis-ceiling-gap 0.12 --unified-walk
#
# Run from repo root:
#   ./run_from_yml.sh

pcd: datasets/livingroom.ply
up_axis: y
seed: 0

# Environment / preprocessing
voxel: 0.05
r_safe: 0.15
ground_thresh: 0.15
ground_clearance: 0.08
max_surface_z: 100.0
max_slope_deg: 50.0
surface_lift: null
walkable_edge_margin: null
obstacle_radius_filter_radius: 0.0
obstacle_radius_filter_min_neighbors: 0
scale: 10

# Ceiling crop (applied inside build_environment; same cloud for planner + viewer)
vis_strip_ceiling: true
vis_ceiling_gap: 0.3
# vis_z_max: null
# vis_ceiling_quantile: null

# Walkable surface detection
# Lengths are in the *scaled* coordinate frame (see --scale). With scale: 10 and
# mesh units ~ metres, multiply metre-scale targets by scale: e.g. ~0.35 m min
# landing footprint -> elev_min_area: 0.12 m² (scaled).
walkable_normal_radii: null
z_min_walkable_surface: 0.4

# 高程图方法 (Fankhauser & Hutter 2018)
elev_max_roughness: 0.15
elev_max_slope: 0.85
elev_min_area: 0.25

# PRM
num_ground: 1500
num_surface: 1500
num_aerial: 1500

unified_walk: true

# Planner
rmax: 5
wg: 1
wf: 5
e_factor: 0.1

# Path smoothing
smoothing: 5.0
spline_degree: 3
lift_epsilon: 1.0

start: [-10, -25, 5]
end: [2, 3, 5]

# Visualization
no_vis: false
show_prm: false
no_samples: false
bg: dark
dim_raw: 0.7
keep_rgb: false
point_size: 2.0
# Scene cloud styling (see visualize_pcd for color modes)
vis_color: height
vis_brightness: 1.0
vis_cloud_voxel: 0.0
vis_cloud_denoise: false
vis_show_normals: false
vis_estimate_normals: false
vis_lighting: false
vis_recenter: false
vis_zoom: 0.7
vis_show_bbox: false
vis_inflated_obstacles: true
vis_inflated_mode: sphere
vis_inflated_voxel: 0.0
vis_inflated_max_centers: 6000
vis_inflated_sphere_samples: 32
vis_inflated_shells: 3
path_radius: null
marker_radius: null
