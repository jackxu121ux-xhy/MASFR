# visualize_pcd.py (keys = argparse dest names with underscores)
# Equivalent to:
#   python visualize_pcd.py --pcd … --color height --bg dark --brightness 1.3
# (standalone viewer defaults to lighting OFF for bright points.)
#
# main_pcd.py uses extra keys: dim_raw (scene dimming; use 1.0 to match this
# look) and vis_lighting (--vis-lighting; default now false like visualize_pcd).
#
# From repo root: ./run_visualize_from_yml.sh

pcd: pointcloude/cleaned_scans_e_x10.pcd
color: height
bg: dark
brightness: 1.3

# main_pcd.py-only inflated-obstacle overlay; visualize_pcd.py ignores these.
vis_inflated_obstacles: false
vis_inflated_max_centers: 6000
vis_inflated_sphere_samples: 32
vis_inflated_shells: 3
